name: Gerar APK Android (Debug)

on:
  push:
    branches:
      - principal
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências do projeto
        run: npm install --no-audit --no-fund

      - name: Garantir permissão de execução nos binários locais
        run: chmod -R +x node_modules/.bin

      - name: Compilar projeto web (Angular/Ionic)
        run: ./node_modules/.bin/ng build --configuration production

      - name: Garantir plataforma Android e sincronizar Capacitor
        run: |
          if [ ! -d "android" ]; then
            ./node_modules/.bin/cap add android
          fi
          ./node_modules/.bin/cap sync android

      - name: Dar permissão ao gradlew e compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar app-debug.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: minhas-tarefas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
